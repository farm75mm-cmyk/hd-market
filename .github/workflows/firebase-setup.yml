name: Firebase setup (google-services.json)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - name: Register Android app and fetch google-services.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: python tools/firebase_setup.py
      - name: Commit google-services.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add store-app/google-services.json
          git commit -m "Add google-services.json for push notifications" || echo "nothing to commit"
          git push
