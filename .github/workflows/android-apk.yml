name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || 'bnE50DJl3uA7BxSwpiSCEJldwt5d68yGi-UhuhjK' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: npx --yes eas-cli@latest whoami
      - name: Link Expo project
        run: |
          npx --yes eas-cli@latest init --non-interactive --force > init.log 2>&1 || { echo "::error::$(sed 's/\x1b\[[0-9;]*m//g' init.log | tail -15 | tr '\n' ' ')"; exit 1; }
          cat init.log
      - name: Build APK on EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json | tee build.json
      - name: Show download link
        run: |
          echo "APK_URL=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));console.log((Array.isArray(b)?b[0]:b).artifacts?.buildUrl||'')")"
