let fgTok="";
$("send").addEventListener("click",async()=>{
  const f=FG[L].fe,em=$("fe").value.trim().toLowerCase();fclr();
  if(!/^\S+@\S+\.\S+$/.test(em))return fshow(f.mail,false,["fe"]);
  const r=await api("forgot",{email:em,lang:L}),er=r.error;
  if(!r.ok)return fshow(er=="no_account"?f.none:er=="mail_failed"?f.nomail:er=="too_many"?f.many:er=="network"?f.net:f.srv,false,["fe"]);
  fgEmail=em;step=2;drawFg();fshow(r.debug_code?f.demo+r.debug_code:FG[L].fs[1],true);$("fc").focus();
});
$("verify").addEventListener("click",async()=>{
  const f=FG[L].fe;fclr();
  const r=await api("verify",{email:fgEmail,code:$("fc").value.trim()});
  if(!r.ok)return fshow(r.error=="network"?f.net:f.code,false,["fc"]);
  fgTok=r.reset_token;step=3;drawFg();$("n1").focus();
});
$("save").addEventListener("click",async()=>{
  const f=FG[L].fe,a=$("n1").value,b=$("n2").value;fclr();
  if(a.length<8)return fshow(f.len,false,["n1"]);
  if(a!==b)return fshow(f.match,false,["n2"]);
  const r=await api("reset",{email:fgEmail,reset_token:fgTok,password:a});
  if(!r.ok)return fshow(r.error=="network"?f.net:f.code,false,["n1"]);
  showFg(false);mode="in";apply();show(f.done,true);
});

}
function drawOpt(){

  (ready?`<textarea class="ta" id="ot" placeholder="${s.paste}"></textarea><div style="padding:0 16px"><button class="go" data-ap="1"><span>${s.apply}</span></button></div>`:`<input id="oq" placeholder="${s.osearch}"><div class="pl" id="ol"></div><div class="ob" id="ob"></div>`);

}
function drawOl(){

}
function drawBar(){

function setQty(i,v){

function openSel(){

  $("panel").innerHTML=`<h2>${s.selected}</h2>`+(sel.length?sel.map(x=>`<div class="line"><span>${x.n} × ${qty[x.id]}</span><span>${fm(x.p*qty[x.id])} USDT</span></div>`).join("")+`<div class="line"><span>${s.total}</span><b>${fm(m.t)} USDT</b></div><button class="go" data-rs="1" style="margin-top:16px"><span>${s.reset}</span></button>`:`<p class="empty">${s.needsel}</p>`);

}
function applyList(){
  const s=S[L],miss=[];
  ($("ot").value||"").split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(.*?)(?:\s*[x×*]\s*(\d+)|\s+(\d+))?\s*$/i),name=(m[1]||l).trim().toLowerCase(),n=+(m[2]||m[3]||1);
    const it=OPT.find(x=>x.n.toLowerCase()==name)||OPT.find(x=>x.n.toLowerCase().includes(name));
    it?qty[it.id]=(qty[it.id]||0)+n:miss.push(l);
  });
  ready=false;drawOpt();
  toast(miss.length?s.unk+miss.join("، "):s.apply+" ✓");
}
function confirmOpt(){
  const s=S[L],m=sums();
  if(!m.c)return toast(s.needsel);
  if(m.t>BAL)return toast(s.nobal);

}

  if(!a)return `<div class="pad"><h2>${s.nav[5]}</h2></div>`;
  const d=new Date(a.c).toLocaleDateString(LOC[L],{day:"numeric",month:"long",year:"numeric"});
  return `<div class="pad" style="padding-bottom:0"><h2>${s.nav[5]}</h2></div><div class="av"><div class="ac">${a.av?`<img src="${a.av}" alt="">`:a.u.charAt(0).toUpperCase()}</div><span class="cm" aria-hidden="true">📷</span><input type="file" id="pf" class="pfo" accept="image/*" aria-label="${t.cam}"></div>
  <div class="pn2">${a.u.replace(/</g,"&lt;")}</div><div class="pe">${a.e}</div><div class="ps">${t.since}<b>${d}</b></div>
  <div class="fc"><label for="nm">${t.user}</label><input class="ti" id="nm" value="${a.u.replace(/"/g,"&quot;")}" maxlength="30" autocomplete="off"><div class="nt">${t.note}</div><div class="er" id="nme" hidden></div><button class="go" data-sv="1"><span>${t.save}</span></button></div>
  <div class="fc"><label>${t.email}</label><input class="ti" value="${a.e}" readonly></div>
  <div class="fc"><label for="lsel2">${s.lang}</label><select id="lsel2" class="sel"><option value="ar">العربية</option><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="zh">中文</option></select><button class="go" id="out" style="margin-top:16px"><span>${s.out}</span></button></div>`;
}
async function saveProf(){
  const a=curAcc(),t=ACC[L],n=$("nm").value.trim(),er=$("nme");
  const bad=m=>{er.textContent=m;er.hidden=false;$("nm").classList.add("bad")};
  er.hidden=true;$("nm").classList.remove("bad");
  if(!n)return bad(t.e1);
  if(n===a.u)return toast(t.ok);
  const r=await api("profile",{token:TOKEN,username:n}),x=r.error;
  if(!r.ok){
    if(x=="too_soon")return bad(t.e2.replace("{n}",r.days));
    if(x=="username_taken")return bad(t.e3);
    if(x=="unauthorized")return sessionOut();
    return bad(S[L].err||t.e1);
  }
  ME=r;drawShop();toast(t.ok);
}
function pickPhoto(f){
  if(!f)return;const t=ACC[L],r=new FileReader();
  r.onerror=()=>toast(t.ph);
  r.onload=()=>{const im=new Image();im.onerror=()=>toast(t.ph);im.onload=()=>{
    const z=256,c=document.createElement("canvas");c.width=c.height=z;const k=Math.max(z/im.width,z/im.height),w=im.width*k,h=im.height*k;
    c.getContext("2d").drawImage(im,(z-w)/2,(z-h)/2,w,h);
    api("profile",{token:TOKEN,avatar:c.toDataURL("image/jpeg",.8)}).then(x=>{if(x.ok){ME=x;drawShop();toast(t.ok)}else if(x.error=="unauthorized")sessionOut();else toast(t.ph)})};im.src=r.result};
  r.readAsDataURL(f);
}
let cat=-1,term="",cart={},fav=new Set(),favOnly=false,tab=0;
const li=()=>LI.indexOf(L);
function toast(t){const x=$("toast");x.textContent=t;x.style.display="block";clearTimeout(x.t);x.t=setTimeout(()=>x.style.display="none",1600)}
function clock(){const d=new Date(),lc=LOC[L];$("clk").textContent="📅 "+d.toLocaleDateString(lc,{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})+"  ⏰ "+d.toLocaleTimeString(lc,{hour12:true})}
setInterval(()=>{if(!document.hidden&&!$("app").hidden)clock()},1000);
function enter(){tab=0;$("auth").hidden=true;$("app").hidden=false;drawShop();scrollTo(0,0)}
function leave(){if(TOKEN)api("logout",{token:TOKEN});setTok(null);ME=null;opt=false;axe=false;aq=[0,0,0,0,0];qty={};cart={};$("sheet").classList.remove("show");$("app").hidden=true;$("auth").hidden=false;apply()}
function drawNav(){
  const s=S[L],n=Object.values(cart).reduce((a,b)=>a+b,0),ic=["🏪","📋","👛","💬","🎧","👤"];
  $("nav").innerHTML=ic.map((e,i)=>`<button data-n="${i}" class="${i==tab?"on":""}"><span>${e}</span>${s.nav[i]}${i==1&&n?" ("+n+")":""}</button>`).join("");
}
function wallet(){const s=S[L];return `<div class="wal"><div class="wic">👛</div><div class="wi"><small>${s.bal}</small><div class="wr"><b>0.00</b><span class="cur">USDT ▾</span></div></div><button class="tp" data-t="1">${s.top}</button></div>`}
function cats(){const q=term.toLowerCase(),l=li();return C.map((c,i)=>({...c,i})).filter(c=>(cat<0||c.i==cat)&&(!favOnly||fav.has(c.i))&&(!q||c.n[l].toLowerCase().includes(q)||c.items.some(x=>x.n[l].toLowerCase().includes(q))))}
function drawGrid(){
  const s=S[L],l=li(),list=cats();
  const oc=axeCard(s)+optCard(s);$("cg").innerHTML=oc+(list.length?list.map(c=>`<div class="cc" style="--t:${c.t}" data-o="${c.i}"><button class="hv ${fav.has(c.i)?"on":""}" data-f="${c.i}" aria-label="${s.fav}">${fav.has(c.i)?"♥":"♡"}</button><div class="pic">${c.e}</div><h3>${c.n[l]}</h3><small>${s.cnt(c.items.length)}</small><span class="go2"></span></div>`).join(""):(oc?"":`<p class="empty" style="grid-column:1/-1">${s.none}</p>`));
}
function drawShop(){
  const s=S[L],l=li();
  $("tag").textContent=s.tag;$("tick").textContent=s.tick+"   •   "+s.tick;clock();drawNav();
  const v=$("view");
  if(axe){drawAxe();return}
  if(opt){drawOpt();return}
  if(tab==0){
    v.innerHTML=wallet()+`<div class="sh"><h2>🏪 ${s.items}</h2><button class="fv ${favOnly?"on":""}" data-v="1">♥ ${s.fav} ${fav.size}</button></div><div class="tiles">`+[{e:"▦",n:s.all,i:-1},...C.map((c,i)=>({e:c.e,n:c.n[l],i}))].map(c=>`<button class="tile ${c.i==cat?"on":""}" data-c="${c.i}"><span>${c.e}</span>${c.n}</button>`).join("")+`</div><input id="q" placeholder="${s.search}"><div class="cg" id="cg"></div>`;
    $("q").value=term;drawGrid();
  }else if(tab==1){
    const ent=Object.entries(cart),tot=ent.reduce((a,[k,q])=>{const[x,y]=k.split("-");return a+C[x].items[y].p*q},0);
    v.innerHTML=`<div class="pad"><h2>${s.nav[1]}</h2>`+(ent.length?ent.map(([k,q])=>{const[x,y]=k.split("-"),it=C[x].items[y];return `<div class="line"><span>${it.e} ${it.n[l]} × ${q}</span><span>$${it.p*q} <button class="rm" data-r="${k}">−</button></span></div>`}).join("")+`<div class="line"><span>${s.total}</span><b>$${tot}</b></div><button class="go" id="buy" style="margin-top:16px"><span>${s.send}</span></button>`:`<p class="empty">${s.empty}</p>`)+`</div>`;
  }else if(tab==2){v.innerHTML=wallet()}
  else if(tab==5){
    v.innerHTML=acctView();
    $("lsel2").value=L;
  }else v.innerHTML=`<div class="pad"><h2>${s.nav[tab]}</h2><p class="empty">${s.soon}</p></div>`;
}
function openCat(i){
  const c=C[i],l=li();
  $("panel").innerHTML=`<h2>${c.e} ${c.n[l]}</h2>`+c.items.map((it,j)=>`<div class="line"><span>${it.e} ${it.n[l]}</span><span>$${it.p} <button class="rm" data-a="${i}-${j}" aria-label="+">+</button></span></div>`).join("");
  $("sheet").classList.add("show");
}
function toggleTheme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"}
document.addEventListener("input",e=>{if(e.target.classList.contains("an")){const v=e.target.value.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,"");e.target.value=v===""?"0":String(+v);setAq(+e.target.dataset.ai,+v||0);return}
  if(e.target.classList.contains("qn")){const v=e.target.value.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,"");e.target.value=v===""?"0":String(+v);setQty(+e.target.dataset.id,+v||0);return}
  if(e.target.id=="q"){term=e.target.value.trim();drawGrid()}else if(e.target.id=="oq"){oterm=e.target.value.trim();drawOl()}});
document.addEventListener("focusin",e=>{if(e.target.classList&&(e.target.classList.contains("qn")))setTimeout(()=>e.target.select(),0)});
document.addEventListener("change",e=>{if(e.target.id=="lsel2")setLang(e.target.value);if(e.target.id=="pf")pickPhoto(e.target.files[0])});
document.addEventListener("click",e=>{
  if($("app").hidden)return;
  const t=e.target.closest("button,.cc,.sheet");if(!t)return;
  const d=t.dataset,s=S[L];
  if(d.f!==undefined){fav.has(+d.f)?fav.delete(+d.f):fav.add(+d.f);drawShop()}
  else if(d.o!==undefined)openCat(+d.o);
  else if(d.ax){axe=true;opt=false;drawShop();scrollTo(0,0)}
  else if(d.axb){axe=false;drawShop()}
  else if(d.aq){const[i,dl]=d.aq.split(":");setAq(+i,(aq[i]||0)+ +dl)}
  else if(d.acf)confirmAxe();
  else if(d.p){opt=true;axe=false;ready=false;oterm="";drawShop();scrollTo(0,0)}
  else if(d.ob){opt=false;drawShop()}
  else if(d.m!==undefined){ready=d.m=="1";drawOpt()}
  else if(d.q){const[i,dl]=d.q.split(":");setQty(+i,(qty[i]||0)+ +dl)}
  else if(d.ap)applyList();
  else if(d.cf)confirmOpt();
  else if(d.ls)openSel();
  else if(d.rs){qty={};$("sheet").classList.remove("show");drawOl();drawBar()}
  else if(d.c!==undefined){cat=+d.c;drawShop()}
  else if(d.v){favOnly=!favOnly;drawShop()}
  else if(d.n!==undefined){opt=false;axe=false;tab=+d.n;drawShop();scrollTo(0,0)}
  else if(d.a){cart[d.a]=(cart[d.a]||0)+1;drawNav();toast(s.added)}
  else if(d.r){if(--cart[d.r]<=0)delete cart[d.r];drawShop()}
  else if(d.pf)$("pf").click();
  else if(d.sv)saveProf();
  else if(d.t)toast(s.soon);
  else if(d.h=="p"){opt=false;axe=false;tab=5;drawShop()}
  else if(d.h=="b")toast(s.bell);
  else if(d.h=="s"){if(opt&&!ready)$("oq").focus();else{opt=false;tab=0;drawShop();$("q").focus()}}
  else if(d.h=="m")toggleTheme();
  else if(t.id=="buy"){cart={};drawShop();toast(s.sent)}
  else if(t.id=="out")leave();
  else if(t.id=="sheet")t.classList.remove("show");
});
apply();
if(TOKEN)api("me",{token:TOKEN}).then(r=>{if(r.ok){ME=r;enter()}else if(r.error=="unauthorized")setTok(null)});
</script>
